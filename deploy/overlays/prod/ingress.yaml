apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agenda-visitas
  annotations:
    # Remova se não usar cert-manager; ajuste o nome do ClusterIssuer
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - visitas.example.com
      secretName: agenda-visitas-tls
  rules:
    - host: visitas.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agenda-visitas
                port:
                  name: http
