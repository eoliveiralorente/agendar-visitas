apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agenda-visitas
resources:
  - ../../base
  - ingress.yaml
images:
  - name: ghcr.io/eoliveiralorente/agendar-visitas
    newTag: 4d6ebfeaa63d0a728c6acafba42e4c11c570d7d9
patches:
  - target:
      kind: ConfigMap
      name: agenda-visitas-config
    patch: |-
      - op: replace
        path: /data/BASE_URL
        value: https://visitas.example.com
      - op: replace
        path: /data/ALLOWED_DOMAINS
        value: ""
      - op: replace
        path: /data/ALLOWED_EMAILS
        value: ""
