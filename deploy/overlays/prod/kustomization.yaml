apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ingress.yaml
images:
  - name: ghcr.io/eoliveiralorente/agenda-visitas
    newTag: latest
patches:
  - target:
      kind: ConfigMap
      name: agenda-visitas-config
    patch: |-
      - op: replace
        path: /data/BASE_URL
        value: https://visitas.example.com
      - op: replace
        path: /data/ALLOWED_DOMAINS
        value: ""
      - op: replace
        path: /data/ALLOWED_EMAILS
        value: ""
