apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agenda-visitas
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - 200-229-75-14.sslip.io
      secretName: agenda-visitas-tls
  rules:
    - host: 200-229-75-14.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agenda-visitas
                port:
                  name: http
