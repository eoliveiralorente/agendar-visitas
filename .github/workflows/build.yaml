name: build

# A cada push na main: roda os testes, gera a imagem, publica no GHCR
# e atualiza a tag no overlay de produção (o ArgoCD aplica sozinho).
on:
  push:
    branches: [main]
    paths-ignore:
      - "deploy/overlays/prod/kustomization.yaml"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/eoliveiralorente/agendar-visitas

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testes
        run: npm test

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Atualizar a tag da imagem no overlay de produção
        run: |
          cd deploy/overlays/prod
          sed -i "s|newTag: .*|newTag: ${GITHUB_SHA}|" kustomization.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add kustomization.yaml
          git commit -m "deploy: agenda-visitas ${GITHUB_SHA::7}" || echo "nada para commitar"
          git push
