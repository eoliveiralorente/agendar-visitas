apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agenda-visitas
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/eoliveiralorente/agendar-visita.git
    targetRevision: main
    path: deploy/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: agenda-visitas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
