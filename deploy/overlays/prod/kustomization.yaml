apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agenda-visitas
resources:
  - ../../base
  - ingress.yaml
images:
  - name: ghcr.io/eoliveiralorente/agendar-visitas
    newTag: c388e80495f234d8a6646ddae3f15200b7638742
patches:
  - target:
      kind: ConfigMap
      name: agenda-visitas-config
    patch: |-
      - op: replace
        path: /data/BASE_URL
        value: https://visitas.example.com
      - op: replace
        path: /data/ALLOWED_DOMAINS
        value: ""
      - op: replace
        path: /data/ALLOWED_EMAILS
        value: ""
